plugins {
    id 'com.android.application'
}
android {
    namespace 'notificationagent.android'
    compileSdk 36
    defaultConfig {
        applicationId 'notificationagent.android'
        minSdk 27
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }
    sourceSets {
        main.java.srcDir('../src/main/java')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
