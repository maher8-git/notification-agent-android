name: Android draft build
on:
  pull_request:
    branches: ['main']
    types: [synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: android-smoke-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GRADLE_VERSION: '8.13'
      GRADLE_SHA256: '20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify toolchain and download pinned Gradle
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_17_X64:?missing JDK 17}"
          test -f "${ANDROID_HOME:?missing SDK}/platforms/android-36/android.jar"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$JAVA_HOME" >> "$GITHUB_PATH"
          zip="$RUNNER_TEMP/gradle-bin.zip"
          curl --fail --location --proto '=https' --retry 2 --max-time 150 -o "$zip" \
            "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          printf '%s  %s\n' "$GRADLE_SHA256" "$zip" | sha256sum -c -
          unzip -q "$zip" -d "$RUNNER_TEMP"
      - name: Verify local core and compile Android
        shell: bash
        run: |
          set -euo pipefail
          sh test-local.sh
          python3 tests/check_android_smoke.py
          "$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin/gradle" --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
